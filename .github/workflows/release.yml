name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish DMG
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and bundle versions
        id: version
        shell: zsh {0}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ '^v[0-9]+\.[0-9]+\.[0-9]+$' ]]; then
            print -u2 "release tag must match vMAJOR.MINOR.PATCH: $tag"
            exit 64
          fi

          host_version="$(plutil -extract CFBundleShortVersionString raw LightQuickLook/Info.plist)"
          preview_version="$(plutil -extract CFBundleShortVersionString raw LightQuickLookPreview/Info.plist)"
          host_build="$(plutil -extract CFBundleVersion raw LightQuickLook/Info.plist)"
          preview_build="$(plutil -extract CFBundleVersion raw LightQuickLookPreview/Info.plist)"

          if [[ "$host_version" != "$preview_version" ]]; then
            print -u2 "bundle version mismatch: host=$host_version preview=$preview_version"
            exit 65
          fi
          if [[ "$host_build" != "$preview_build" ]]; then
            print -u2 "bundle build mismatch: host=$host_build preview=$preview_build"
            exit 65
          fi
          if [[ "$tag" != "v${host_version}" ]]; then
            print -u2 "tag/version mismatch: tag=$tag bundle=$host_version"
            exit 65
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            print -u2 "release tag must point to a commit reachable from origin/main"
            exit 65
          fi

          print "version=$host_version" >> "$GITHUB_OUTPUT"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run complete release validation
        run: ./Scripts/build-release-dmg.sh

      - name: Verify release checksum
        shell: zsh {0}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c "LightQuickLook-${VERSION}-unnotarized-SHA256.txt"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/LightQuickLook-${VERSION}-unnotarized.dmg#LightQuickLook ${VERSION} DMG (unnotarized)" \
            "dist/LightQuickLook-${VERSION}-unnotarized-SHA256.txt#SHA-256 checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --fail-on-no-commits \
            --latest \
            --title "LightQuickLook ${VERSION}" \
            --notes "This build is ad hoc signed and is not notarized by Apple. Review the installation and Gatekeeper instructions in the README before opening it." \
            --generate-notes
